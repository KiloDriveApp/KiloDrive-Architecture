name: Public documentation audit

on:
  push:
  pull_request:

concurrency:
  group: docs-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Compile audit tooling
        run: python -m compileall -q tools
      - name: Check relative links and public-safe content
        run: |
          python tools/audit_docs.py
          python tools/native_handbook.py
          python tools/source_baseline.py
      - name: Verify public CycloneDX baseline and hash
        run: python tools/generate_public_sbom.py --check
      - name: Verify curated API contract, dictionary and publication boundary
        run: |
          python tools/public_api.py --check
          python -m unittest discover -s tools -p "test_*.py"
      - name: Validate OpenAPI 3 syntax and local references
        run: |
          python -m pip install --disable-pip-version-check openapi-spec-validator==0.7.2
          python -c "import json; from openapi_spec_validator import validate; validate(json.load(open('docs/api/openapi/kilodrive-public-v1.json', encoding='utf-8')))"
      - name: Check Markdown structure
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"
      - name: Check spelling
        run: |
          python -m pip install --disable-pip-version-check codespell==2.4.3
          codespell .
