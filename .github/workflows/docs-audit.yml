name: Public documentation audit

on:
  push:
  pull_request:

concurrency:
  group: docs-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile audit tooling
        run: python -m py_compile tools/audit_docs.py tools/generate_public_sbom.py
      - name: Check relative links and public-safe content
        run: python tools/audit_docs.py
      - name: Verify public CycloneDX baseline and hash
        run: python tools/generate_public_sbom.py --check
      - name: Check Markdown structure
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"
      - name: Check spelling
        run: |
          python -m pip install --disable-pip-version-check codespell==2.4.3
          codespell .
